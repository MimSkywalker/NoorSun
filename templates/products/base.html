{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}فروشگاه{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
            margin: 0;
            padding: 0;
        }
        header {
            background: #1f2937;
            color: #fff;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }
        header .btn {
            background: #3b82f6;
            padding: 8px 16px;
            border-radius: 6px;
        }
        .container {
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 16px;
        }
        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 16px;
        }
        .messages li {
            background: #dcfce7;
            color: #166534;
            padding: 10px 16px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            padding: 20px;
            margin-bottom: 16px;
        }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-danger { background: #ef4444; }
        .btn-secondary { background: #6b7280; }
        form input, form textarea, form select {
            width: 100%;
            padding: 8px;
            margin: 6px 0 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .product-grid .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #eee;
        }
        .price { color: #16a34a; font-weight: bold; }
        .badge {
            display: inline-block;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 12px;
            background: #e5e7eb;
        }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'products:list' %}">🛍️ فروشگاه</a>
        <a href="{% url 'products:create' %}" class="btn">+ محصول جدید</a>
    </header>
    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
