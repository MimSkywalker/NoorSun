{% extends 'products/base.html' %}

{% block title %}
  حذف محصول
{% endblock %}

{% block content %}
  <div class="card">
    <h2>آیا از حذف «{{ object.title }}» مطمئنی؟</h2>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">بله، حذف کن</button>
      <a href="{% url 'products:detail' object.pk %}" class="btn btn-secondary">انصراف</a>
    </form>
  </div>
{% endblock %}
