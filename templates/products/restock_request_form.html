{% extends 'base.html' %}
{% block title %}
  اطلاع‌رسانی موجود شدن کالا
{% endblock %}
{% block content %}
  <div class="restock-request-box">
    <h2>اطلاع بده وقتی موجود شد</h2>
    <p>کالا: {{ variant.product.title }} — {{ variant }}</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">ثبت درخواست</button>
    </form>
  </div>
{% endblock %}
