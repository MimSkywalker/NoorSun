{% extends "base.html" %}
{% block title %}تعیین رمز جدید{% endblock %}
{% block content %}
{% if valid_link %}
    <h1>رمز عبور جدید</h1>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">ثبت</button></form>
{% else %}
    <h1>لینک نامعتبر یا منقضی شده است.</h1>
{% endif %}
{% endblock %}
